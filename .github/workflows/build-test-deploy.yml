name: Android CI

on: 
  push:
    branches: ["main"]
  pull_request: 
    branches: ["main"]

jobs:
  # 1. TESTS (first filter)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: "**/build/reports/tests/testDebugUnitTest/"
        
# 2. Build to create the enviroment and to run our project only if passed test
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Grant execute pemission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug
        env:
          GEMINI_API_KEY: ${{secrets.GEMINI_API_KEY}}

# 3. Create the Artifact job after build success
  artifact:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dogedex-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      
